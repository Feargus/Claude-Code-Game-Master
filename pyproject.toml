[project]
name = "gm-claude"
version = "0.2.0"
description = "AI Game Master for running tabletop-style campaigns with Claude Code"
authors = [
    { name = "Sean Stobo" }
]
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.11"
keywords = ["tabletop", "rpg", "game-master", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

# Core dependencies. numpy, onnxruntime and tokenizers are semantic recall
# (EmbeddingGemma on ONNX Runtime, no PyTorch), which recording a fact needs; the
# model itself is downloaded by `bash tools/gm-recall.sh setup`. pdfplumber, pypdf and
# python-docx read a book for import.
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "pdfplumber>=0.11.9",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/Sstobo/Claude-Code-Game-Master"
Documentation = "https://github.com/Sstobo/Claude-Code-Game-Master/wiki"
Repository = "https://github.com/Sstobo/Claude-Code-Game-Master"
Issues = "https://github.com/Sstobo/Claude-Code-Game-Master/issues"
Author = "https://www.linkedin.com/in/sean-stobo/"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["lib"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The scripts in lib/ import each other by bare name (sys.path), so lib/ counts as
# first-party for the import order.
src = ["lib", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]
ignore = ["E501"]  # line length: the line-length above is a guide, not a rule

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
